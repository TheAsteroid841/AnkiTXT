name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade "pip<25" setuptools wheel
          python -m pip install "buildozer==1.5.0" "python-for-android==2024.01.21" "cython==0.29.36" "PyYAML==6.0.1"
      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
      - name: Build APK
        run: |
          rm -rf .buildozer
          yes | buildozer android debug || yes | buildozer android debug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ankitxt-apk
          path: bin/*.apk
